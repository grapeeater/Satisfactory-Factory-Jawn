# P3 on the simulator: two REAL DeepSeek agents (deepseek-flash, thinking off) managing the
# simulated plates-and-rods factory. Spends real money: paid calls need allow_paid below AND
# JAWN_ALLOW_PAID_CALLS=1, and every call reserves its worst-case cost against budget.max_usd.
# Must run with wall-clock time:
#   $env:JAWN_ALLOW_PAID_CALLS=1; uv run jawn compare --config experiments/sim_deepseek_plates_and_rods.toml \n#       --provider deepseek --realtime --speed 4 --runs 3 --max-total-usd 0.25

[experiment]
name = "sim-deepseek-plates-and-rods"
duration_s = 1200
poll_interval_s = 5
end_when_targets_met = true
settle_s = 10
controller = "agents"            # or "baseline"
initial_state = { plate = "disabled", rod = "disabled" }

[frm]
base_url = "http://127.0.0.1:8080"   # live FRM (P1+); ignored when running on the simulator
token_env = "FRM_TOKEN"
read_endpoints = ["getFactory", "getStorageInv", "getPower", "getSwitches", "getSessionInfo", "getChatMessages"]
write_endpoints = ["setEnabled", "sendChatMessage"]
timeout_s = 3.0
get_retries = 1

[safety]
max_decision_age_s = 30
max_snapshot_age_s = 20
min_dwell_s = 10
human_lock_s = 120
verify_timeout_s = 15
max_writes_per_min = 12
power_margin = 0.05
count_pending_as_running = true
chat_commands = true
chat_prefix = "!jawn"
announce_in_chat = false
stop_file = "../STOP"
on_stop = "restore"
stop_restore_timeout_s = 30
game_paused_after_s = 12

[targets.plate]
id = "Build_ConstructorMk1_C_2147480001"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_IronPlate_C"
product = "Desc_IronPlate_C"
location = [1500.0, -400.0, 0.0]
description = "Constructor making Iron Plates"

[targets.rod]
id = "Build_ConstructorMk1_C_2147480002"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_IronRod_C"
product = "Desc_IronRod_C"
location = [1500.0, 400.0, 0.0]
description = "Constructor making Iron Rods"

[[constraints]]
kind = "max_running"
name = "one-at-a-time"
targets = ["plate", "rod"]
max = 1

[[agents]]
id = "plate_agent"
role = "Plate line manager"
objective = "Deliver 80 Iron Plates to the plate storage before time runs out, while respecting the shared one-at-a-time rule."
owns = ["plate"]
targets = { Desc_IronPlate_C = 80 }
personality = "cooperative"
on_budget_exhausted = "baseline"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 180

[[agents]]
id = "rod_agent"
role = "Rod line manager"
objective = "Deliver 80 Iron Rods to the rod storage before time runs out, while respecting the shared one-at-a-time rule."
owns = ["rod"]
targets = { Desc_IronRod_C = 80 }
personality = "cooperative"
on_budget_exhausted = "baseline"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 180

[llm]
provider = "deepseek"
max_concurrent = 2
[llm.mock]
latency_s = 2.0
seed = 0
simulate_usage = true
[llm.deepseek]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
allow_paid = true
mode = "tools_strict"
max_tokens = 400                 # 200 truncated 3/11 real responses (finish_reason=length)
temperature = 0.0
timeout_s = 30
max_retries = 2

[budget]
max_usd = 0.06                   # per-run real-spend cap (compare also enforces a total cap)
max_calls = 120
max_calls_per_agent = 60
simulated_max_usd = 1.0

[sim]
scenario = "../scenarios/plates_and_rods.toml"
seed = 0
token = "sim-token"

[dashboard]
enabled = false
host = "127.0.0.1"
port = 8787
