# P4: four independent agents on a power-limited factory (scenarios/power_grid.toml).
#   plate_agent  - plate constructor        (80 Iron Plate)
#   rod_agent    - rod constructor          (80 Iron Rod)
#   copper_agent - wire + cable constructors (40 Cable; owns a two-machine chain)
#   power_agent  - the three power switches  (keep the lines powered, spend little backup fuel)
# There is no slot rule: the arbiter's power model (pessimistic demand, learned switch
# topology) is what couples the agents. Offline: simulator + mock models, no paid calls.

[experiment]
name = "power-grid"
duration_s = 1200
poll_interval_s = 5
end_when_targets_met = true
settle_s = 10
controller = "agents"
initial_state = { plate = "disabled", rod = "disabled", wire = "disabled", cable = "disabled", backup_tie = "off", iron_tie = "on", copper_tie = "on" }

[frm]
base_url = "http://127.0.0.1:8080"
token_env = "FRM_TOKEN"
read_endpoints = ["getFactory", "getStorageInv", "getPower", "getSwitches", "getSessionInfo", "getChatMessages"]
write_endpoints = ["setEnabled", "setSwitches", "sendChatMessage"]
timeout_s = 3.0
get_retries = 1

[safety]
max_decision_age_s = 30
max_snapshot_age_s = 20
min_dwell_s = 10
human_lock_s = 120
shed_lock_s = 20
verify_timeout_s = 15
max_writes_per_min = 12
power_margin = 0.05
chat_commands = true
announce_in_chat = false
stop_file = "../STOP"
on_stop = "restore"
stop_restore_timeout_s = 40
game_paused_after_s = 12
advisory_min_interval_s = 120

[targets.plate]
id = "Build_ConstructorMk1_C_2147480001"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_IronPlate_C"
product = "Desc_IronPlate_C"
location = [1500.0, -400.0, 0.0]
description = "Constructor making Iron Plates (iron line)"

[targets.rod]
id = "Build_ConstructorMk1_C_2147480002"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_IronRod_C"
product = "Desc_IronRod_C"
location = [1500.0, 400.0, 0.0]
description = "Constructor making Iron Rods (iron line)"

[targets.wire]
id = "Build_ConstructorMk1_C_2147480010"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_Wire_C"
location = [1500.0, 2000.0, 0.0]
description = "Constructor making Wire, belted straight into the cable constructor"

[targets.cable]
id = "Build_ConstructorMk1_C_2147480011"
class_name = "Build_ConstructorMk1_C"
recipe_class = "Recipe_Cable_C"
product = "Desc_Cable_C"
location = [2000.0, 2000.0, 0.0]
description = "Constructor making Cable from Wire (copper line)"

[targets.iron_tie]
id = "Build_PriorityPowerSwitch_C_2147465002"
kind = "switch"
description = "Priority switch feeding the iron line from the main bus"

[targets.copper_tie]
id = "Build_PriorityPowerSwitch_C_2147465003"
kind = "switch"
description = "Priority switch feeding the copper line from the main bus"

[targets.backup_tie]
id = "Build_PowerSwitch_C_2147465009"
kind = "switch"
description = "Connects the fuel-limited backup coal generator to the main bus"

[[agents]]
id = "plate_agent"
role = "Plate line manager"
objective = "Deliver 80 Iron Plates to the plate storage before time runs out. Power is shared and limited."
owns = ["plate"]
targets = { Desc_IronPlate_C = 80 }
personality = "cooperative"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 180

[[agents]]
id = "rod_agent"
role = "Rod line manager"
objective = "Deliver 80 Iron Rods to the rod storage before time runs out. Power is shared and limited."
owns = ["rod"]
targets = { Desc_IronRod_C = 80 }
personality = "cooperative"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 180

[[agents]]
id = "copper_agent"
role = "Copper line manager"
objective = "Deliver 40 Cable to the cable storage before time runs out. The wire constructor feeds the cable constructor directly; run both. Power is shared and limited."
owns = ["wire", "cable"]
targets = { Desc_Cable_C = 40 }
personality = "cooperative"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 180

[[agents]]
id = "power_agent"
role = "Power manager"
objective = "Keep the production lines powered without tripping fuses. Use the backup generator only when demand needs it (its fuel is limited), and switch it off when it is no longer needed. Restore any line whose switch was shed."
owns = ["iron_tie", "copper_tie", "backup_tie"]
allowed_actions = ["switch.on", "switch.off", "switch.set_priority"]
personality = "power"
on_budget_exhausted = "baseline"
[agents.triggers]
min_interval_s = 15
heartbeat_s = 120

[llm]
provider = "mock"
max_concurrent = 4
[llm.mock]
latency_s = 2.0
seed = 0
simulate_usage = true
[llm.deepseek]
model = "deepseek-flash"
allow_paid = false
mode = "tools_strict"
max_tokens = 400

[budget]
max_usd = 0.0
max_calls = 400
max_calls_per_agent = 150
simulated_max_usd = 1.0

[sim]
scenario = "../scenarios/power_grid.toml"
seed = 0
token = "sim-token"
