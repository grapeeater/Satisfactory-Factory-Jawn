# P4 factory: two production lines share a small power plant; a fuel-limited backup
# generator can be switched in. Power, not a slot rule, is what couples the agents.
#
#   circuit 1  main bus: Biomass Burner Bank 20 MW
#   circuit 2  iron line (via "Iron Line" priority switch, priority 2 = shed first)
#                Iron Smelter (Dave's), Constructor plate, Constructor rod
#   circuit 3  copper line (via "Copper Line" priority switch, priority 1)
#                Copper Smelter (Dave's), Constructor wire -> Constructor cable
#   circuit 9  Backup Coal Generator 10 MW, 900 s of fuel (via plain "Backup Tie" switch)
#
# Load: smelters 2 x 4 MW + 4 managed constructors x 4 MW = 24 MW > 20 MW. Without the backup
# at most two managed constructors can run at once (5% margin: 19 MW usable). Dave's own
# state fits the plant: the iron line runs, the copper constructors are parked.

session_name = "JawnSim-PowerGrid"

[[generators]]
id = "Build_GeneratorBiomass_Automated_C_2147460001"
name = "Biomass Burner Bank"
class_name = "Build_GeneratorBiomass_Automated_C"
circuit = 1
capacity_mw = 20.0

