[project]
name = "factory-jawn"
version = "0.1.0"
description = "Multi-agent factory management harness for Satisfactory (via Ficsit Remote Monitoring), with an offline FRM simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.8",
]

[project.scripts]
jawn = "jawn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jawn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]
